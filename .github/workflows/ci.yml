# Runs hello.py on every push to main and on pull requests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-hello:
    name: Run hello.py
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Display Python version
        run: python --version

      - name: Run hello.py
        run: python hello.py

      - name: Run sysinfo.sh
        run: |
          chmod +x scripts/sysinfo.sh
          ./scripts/sysinfo.sh
